# Nginx Configuration for faridagri.devzytic.com
# This config proxies to your PM2 app running on port 5002
# Place this in: /etc/nginx/conf.d/faridagri.devzytic.com.conf (CentOS/RHEL)
# Or: /etc/nginx/sites-available/faridagri.devzytic.com (Ubuntu/Debian)

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    server_name faridagri.devzytic.com;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name faridagri.devzytic.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/faridagri.devzytic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faridagri.devzytic.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Increase body size limit for file uploads
    client_max_body_size 10M;

    # Proxy all requests to your PM2 app on port 5002
    location / {
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Logging
    access_log /var/log/nginx/faridagri.devzytic.com.access.log;
    error_log /var/log/nginx/faridagri.devzytic.com.error.log;
}
