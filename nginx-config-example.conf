# Nginx Configuration for faridagri.devzytic.com
# Place this file at: /etc/nginx/sites-available/faridagri.devzytic.com
# Then create a symlink: ln -s /etc/nginx/sites-available/faridagri.devzytic.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name faridagri.devzytic.com;

    # Increase body size limit for file uploads (if needed)
    client_max_body_size 10M;

    location / {
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Optional: Logging
    access_log /var/log/nginx/faridagri.devzytic.com.access.log;
    error_log /var/log/nginx/faridagri.devzytic.com.error.log;
}
